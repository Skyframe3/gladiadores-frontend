<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Fondo circunferencia -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#8FFF2A" stroke-width="2" opacity="0.3"/>

  <!-- Casco gladiador (simplificado) -->
  <g transform="translate(100, 100)">
    <!-- Pluma/cresta superior -->
    <path d="M -8 -45 Q -5 -55 0 -60 Q 5 -55 8 -45" fill="none" stroke="#8FFF2A" stroke-width="3" stroke-linecap="round"/>

    <!-- Casco -->
    <path d="M -35 -20 L -30 -40 Q 0 -50 30 -40 L 35 -20 Z" fill="none" stroke="#8FFF2A" stroke-width="2.5"/>

    <!-- Visera -->
    <path d="M -28 -15 Q 0 -18 28 -15" fill="none" stroke="#8FFF2A" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Protector lateral izq -->
    <path d="M -35 -18 L -40 15" fill="none" stroke="#8FFF2A" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Protector lateral der -->
    <path d="M 35 -18 L 40 15" fill="none" stroke="#8FFF2A" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Barboquejo (cadena) -->
    <path d="M -25 15 Q 0 20 25 15" fill="none" stroke="#8FFF2A" stroke-width="2" stroke-dasharray="3,2"/>

    <!-- Espada mini (detrás) -->
    <line x1="-5" y1="40" x2="-5" y2="60" stroke="#FF6B1F" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="-8" y1="42" x2="-2" y2="42" stroke="#FF6B1F" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Texto "G" simplificado -->
  <text x="100" y="145" font-size="45" font-weight="900" fill="#8FFF2A" text-anchor="middle" font-family="Arial, sans-serif" letter-spacing="2">G</text>
</svg>