<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Gladiadores Off Road</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0A0612;
      color: #F2EAF7;
      min-height: 100vh;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
    h1 { color: #FF7A00; margin-bottom: 2rem; }
    .logo { width: 60px; height: 60px; margin-bottom: 2rem; }
    .logo img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 10px rgba(255,122,0, 0.6)); }

    /* LOGIN */
    .login-box {
      max-width: 400px;
      margin: 5rem auto;
      background: #16101F;
      border: 1px solid rgba(176,38,255, 0.3);
      border-radius: 12px;
      padding: 2rem;
    }
    .login-box h2 { color: #FF7A00; margin-bottom: 1.5rem; text-align: center; }
    .login-box .logo { text-align: center; margin-bottom: 1rem; }
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; margin-bottom: 0.5rem; color: #BDB0C9; font-size: 0.9rem; }
    .form-group input {
      width: 100%;
      padding: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(176,38,255, 0.2);
      border-radius: 8px;
      color: #F2EAF7;
      font-family: inherit;
    }
    .form-group input:focus { outline: none; border-color: #FF7A00; box-shadow: 0 0 0 3px rgba(255,122,0, 0.15); }
    .btn-login {
      width: 100%;
      padding: 0.75rem;
      background: #FF7A00;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(255,122,0, 0.5); }
    .error { color: #ff6b6b; font-size: 0.9rem; margin-top: 1rem; }

    /* TABS */
    .tabs { display: flex; gap: 8px; margin-bottom: 1.5rem; border-bottom: 1px solid rgba(176,38,255,0.15); }
    .tab {
      padding: 0.7rem 1.4rem; background: none; border: none; border-bottom: 2px solid transparent;
      color: #BDB0C9; font-family: inherit; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    .tab:hover { color: #F2EAF7; }
    .tab.active { color: #B026FF; border-bottom-color: #B026FF; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .tab-hint { color: #BDB0C9; font-size: 0.9rem; margin-bottom: 1.25rem; }

    /* CATÁLOGO */
    .ruta-card {
      background: #16101F; border: 1px solid rgba(176,38,255,0.18); border-radius: 12px;
      padding: 1.25rem; margin-bottom: 1rem;
    }
    .ruta-card.off { opacity: 0.5; }
    .ruta-top { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .ruta-nombre { font-size: 1.1rem; font-weight: 700; color: #F2EAF7; }
    .ruta-meta { color: #9186A0; font-size: 0.82rem; margin-top: 2px; }
    .ruta-body { margin-top: 1.1rem; padding-top: 1.1rem; border-top: 1px solid rgba(255,255,255,0.07); }
    .bloque-lbl { color: #B026FF; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; margin-bottom: 0.6rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.1rem; }
    .chip {
      padding: 0.35rem 0.8rem; border-radius: 999px; font-size: 0.85rem; cursor: pointer;
      background: rgba(176,38,255,0.13); border: 1px solid rgba(176,38,255,0.45); color: #B026FF;
      font-family: inherit;
    }
    .chip.off { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.12); color: #6B6178; text-decoration: line-through; }
    .unidad-row {
      display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap;
      padding: 0.7rem 0; border-top: 1px solid rgba(255,255,255,0.05);
    }
    .unidad-nombre { flex: 1; min-width: 150px; color: #F2EAF7; font-size: 0.92rem; }
    .unidad-nombre small { display: block; color: #9186A0; font-size: 0.76rem; }
    .precio-input {
      width: 100px; padding: 0.45rem 0.6rem; background: rgba(255,255,255,0.05);
      border: 1px solid rgba(176,38,255,0.2); border-radius: 8px; color: #F2EAF7; font-family: inherit;
    }
    .precio-input:focus { outline: none; border-color: #B026FF; }
    .asientos { display: flex; gap: 4px; }
    .asiento {
      width: 30px; height: 30px; border-radius: 7px; cursor: pointer; font-size: 0.8rem; font-weight: 700;
      background: rgba(176,38,255,0.13); border: 1px solid rgba(176,38,255,0.45); color: #B026FF;
      font-family: inherit;
    }
    .asiento.off { background: rgba(255,90,90,0.13); border-color: rgba(255,90,90,0.45); color: #FF5A5A; }
    .switch {
      padding: 0.4rem 0.9rem; border-radius: 8px; font-size: 0.8rem; font-weight: 700; cursor: pointer;
      font-family: inherit; border: 1px solid;
    }
    .switch.on { background: rgba(176,38,255,0.13); border-color: rgba(176,38,255,0.5); color: #B026FF; }
    .switch.off { background: rgba(255,90,90,0.1); border-color: rgba(255,90,90,0.4); color: #FF5A5A; }
    .btn-guardar {
      padding: 0.55rem 1.4rem; background: #FF7A00; color: #fff; border: none; border-radius: 8px;
      font-weight: 700; cursor: pointer; font-family: inherit;
    }
    .btn-guardar:hover { box-shadow: 0 0 16px rgba(255,122,0,0.45); }
    .btn-guardar:disabled { opacity: 0.5; cursor: default; box-shadow: none; }
    .guardado { color: #B026FF; font-size: 0.85rem; }

    /* ADMIN PANEL */
    .admin-panel { display: none; }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(255,122,0, 0.2);
    }
    .admin-user { color: #BDB0C9; font-size: 0.9rem; }
    .btn-logout {
      background: #FF7A00;
      color: white;
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-logout:hover { background: #e86200; }

    /* TABLA DE RESERVAS */
    .reservas-table {
      background: #16101F;
      border: 1px solid rgba(255,122,0, 0.2);
      border-radius: 12px;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      background: rgba(255,122,0, 0.1);
      padding: 1rem;
      text-align: left;
      font-weight: 600;
      color: #FF7A00;
      border-bottom: 1px solid rgba(255,122,0, 0.2);
    }
    td {
      padding: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    tr:hover { background: rgba(255,122,0, 0.08); }

    /* ESTADOS */
    .estado-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .estado-confirmada { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
    .estado-cancelada { background: rgba(244, 67, 54, 0.2); color: #f44336; }
    .estado-completada { background: rgba(33, 150, 243, 0.2); color: #2196f3; }
    .estado-no_show { background: rgba(255, 152, 0, 0.2); color: #ff9800; }

    /* MODAL */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); z-index: 1000; align-items: center; justify-content: center; }
    .modal.open { display: flex; }
    .modal-content {
      background: #16101F;
      border: 1px solid rgba(255,122,0, 0.3);
      border-radius: 12px;
      padding: 2rem;
      max-width: 500px;
      width: 90%;
    }
    .modal-content h3 { color: #FF7A00; margin-bottom: 1rem; }
    .modal-body { margin-bottom: 1.5rem; max-height: 60vh; overflow-y: auto; }
    .modal-detail { margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    .modal-detail b { color: #FF7A00; }
    .modal-actions {
      display: flex;
      gap: 1rem;
    }
    .btn-modal {
      flex: 1;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-primary { background: #FF7A00; color: #fff; }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 15px rgba(255,122,0, 0.4); }
    .btn-secondary { background: rgba(255, 255, 255, 0.1); color: #F2EAF7; }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.15); }
  </style>
</head>
<body>
  <div class="container">
    <!-- LOGIN -->
    <div id="login" class="login-box">
      <div class="logo" style="text-align:center;">
        <img src="img/i1.png" alt="Gladiadores Off Road" style="width:100px;height:100px;object-fit:contain;filter:drop-shadow(0 0 15px rgba(255,122,0,0.6));">
      </div>
      <h2>Admin</h2>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="tu@email.com">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="Contraseña">
      </div>
      <button class="btn-login" onclick="login()">INGRESAR</button>
      <div id="login-error" class="error"></div>
    </div>

    <!-- ADMIN PANEL -->
    <div id="panel" class="admin-panel">
      <div class="admin-header">
        <h1>📊 Panel de Admin</h1>
        <div>
          <div class="admin-user">Admin: <b id="admin-name"></b></div>
          <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="reservas" onclick="switchTab('reservas')">Reservas</button>
        <button class="tab" data-tab="catalogo" onclick="switchTab('catalogo')">Catálogo</button>
      </div>

      <!-- CATÁLOGO -->
      <div id="tab-catalogo" class="tab-panel">
        <p class="tab-hint">Cambia precios, apaga rutas, unidades, horarios o asientos. Lo que apagues deja de verse en la página.</p>
        <div id="catalogo-lista"><p style="color:#BDB0C9">Cargando catálogo...</p></div>
      </div>

      <!-- RESERVAS -->
      <div id="tab-reservas" class="tab-panel active reservas-table">
        <table id="tabla-reservas">
          <thead>
            <tr>
              <th>Folio</th>
              <th>Cliente</th>
              <th>Email</th>
              <th>Ruta</th>
              <th>Fecha</th>
              <th>Monto</th>
              <th>Estado</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tbody-reservas">
            <tr><td colspan="8" style="text-align: center; color: #999;">Cargando reservas...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- MODAL DE DETALLES -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <h3>Detalles de Reserva</h3>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions">
        <select id="estado-select" class="btn-modal" style="background: rgba(255, 255, 255, 0.1); color: #F2EAF7; font-weight: 600; cursor: pointer;">
          <option value="">-- Cambiar estado --</option>
          <option value="confirmada">✓ Confirmada</option>
          <option value="cancelada">✗ Cancelada</option>
          <option value="completada">✅ Completada</option>
          <option value="no_show">⊘ No Show</option>
        </select>
        <button class="btn-modal btn-secondary" onclick="closeModal()">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://gladiadores-backend.vercel.app';
    let token = null;
    let currentReservaId = null;
    let reservasCache = [];

    function esc(s) {
      if (s == null) return '';
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }

    function checkSession() {
      token = localStorage.getItem('admin_token');
      if (token) {
        try {
          const parts = token.split('.');
          if (parts.length !== 3) throw new Error('bad token');
          const payload = JSON.parse(atob(parts[1]));
          if (payload.exp && payload.exp * 1000 < Date.now()) {
            localStorage.removeItem('admin_token');
            token = null;
            return;
          }
          loadPanel();
        } catch (e) {
          localStorage.removeItem('admin_token');
          token = null;
        }
      }
    }

    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('login-error');

      if (!email || !password) {
        errorDiv.textContent = 'Completa email y contraseña';
        return;
      }

      try {
        const res = await fetch(`${API_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.ok) {
          token = data.token;
          localStorage.setItem('admin_token', token);
          loadPanel();
        } else {
          errorDiv.textContent = data.error || 'Error al autenticar';
        }
      } catch (err) {
        errorDiv.textContent = 'Error de conexión';
      }
    }

    async function loadPanel() {
      document.getElementById('login').style.display = 'none';
      document.getElementById('panel').style.display = 'block';

      const payload = JSON.parse(atob(token.split('.')[1]));
      document.getElementById('admin-name').textContent = payload.email;

      loadReservas();
    }

    async function loadReservas() {
      try {
        const res = await fetch(`${API_URL}/api/reservas`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const data = await res.json();

        if (data.ok && data.reservas) {
          reservasCache = data.reservas;
          renderReservas(data.reservas);
        } else {
          const td = document.createElement('td');
          td.colSpan = 8;
          td.style.color = '#ff6b6b';
          td.textContent = 'Error: ' + (data.error || 'Desconocido');
          const tr = document.createElement('tr');
          tr.appendChild(td);
          const tbody = document.getElementById('tbody-reservas');
          tbody.innerHTML = '';
          tbody.appendChild(tr);
        }
      } catch (err) {
        document.getElementById('tbody-reservas').innerHTML = '<tr><td colspan="8" style="color: #ff6b6b;">Error de conexión</td></tr>';
      }
    }

    function renderReservas(reservas) {
      const tbody = document.getElementById('tbody-reservas');
      tbody.innerHTML = reservas.map((r, idx) => `
        <tr>
          <td><b>${esc(r.folio)}</b></td>
          <td>${esc(r.cliente?.nombre)}</td>
          <td>${esc(r.cliente?.email)}</td>
          <td>${esc(r.ruta)}</td>
          <td>${new Date(r.fecha).toLocaleDateString('es-MX')}</td>
          <td>$${esc(String(r.monto))}</td>
          <td><span class="estado-badge estado-${esc(r.estado)}">${esc(r.estado)}</span></td>
          <td><button class="btn-modal btn-primary" onclick="openModalByIdx(${idx})">Ver</button></td>
        </tr>
      `).join('');
    }

    function openModalByIdx(idx) {
      const r = reservasCache[idx];
      if (!r) return;
      openModal(r.folio, r);
    }

    function openModal(id, reserva) {
      currentReservaId = id;
      const modal = document.getElementById('modal');
      const body = document.getElementById('modal-body');
      const select = document.getElementById('estado-select');

      body.innerHTML = `
        <div class="modal-detail"><b>Folio:</b> ${esc(reserva.folio)}</div>
        <div class="modal-detail"><b>Cliente:</b> ${esc(reserva.cliente?.nombre)}</div>
        <div class="modal-detail"><b>Email:</b> ${esc(reserva.cliente?.email)}</div>
        <div class="modal-detail"><b>WhatsApp:</b> ${esc(reserva.cliente?.whatsapp)}</div>
        <div class="modal-detail"><b>Ruta:</b> ${esc(reserva.ruta)}</div>
        <div class="modal-detail"><b>Unidad:</b> ${esc(reserva.unidad)}</div>
        <div class="modal-detail"><b>Asientos:</b> ${esc(reserva.asientos?.join(', '))}</div>
        <div class="modal-detail"><b>Monto:</b> $${esc(String(reserva.monto))}</div>
        <div class="modal-detail"><b>Estado Actual:</b> <span class="estado-badge estado-${esc(reserva.estado)}">${esc(reserva.estado)}</span></div>
      `;

      select.value = reserva.estado;
      modal.classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('open');
      currentReservaId = null;
    }

    async function changeEstado(event) {
      const nuevoEstado = event.target.value;
      if (!nuevoEstado || !currentReservaId) return;
      const validEstados = ['confirmada','cancelada','completada','no_show'];
      if (!validEstados.includes(nuevoEstado)) return;

      try {
        const res = await fetch(`${API_URL}/api/reservas/${encodeURIComponent(currentReservaId)}/estado`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ estado: nuevoEstado })
        });

        const data = await res.json();

        if (data.ok) {
          closeModal();
          loadReservas();
        }
      } catch (err) {
        alert('Error al actualizar estado');
      }
    }

    document.getElementById('estado-select').addEventListener('change', changeEstado);

    /* ===== CATÁLOGO ===== */
    let catalogoCache = [];

    function switchTab(nombre) {
      document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === nombre));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + nombre));
      if (nombre === 'catalogo' && catalogoCache.length === 0) loadCatalogo();
    }

    async function loadCatalogo() {
      const cont = document.getElementById('catalogo-lista');
      try {
        const res = await fetch(`${API_URL}/api/catalogo/admin`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (data.ok && data.rutas) {
          catalogoCache = data.rutas;
          renderCatalogo();
        } else {
          cont.textContent = 'Error: ' + (data.error || 'No se pudo cargar el catálogo');
          cont.style.color = '#ff6b6b';
        }
      } catch (err) {
        cont.textContent = 'Error de conexión';
        cont.style.color = '#ff6b6b';
      }
    }

    function renderCatalogo() {
      document.getElementById('catalogo-lista').innerHTML = catalogoCache.map((r, i) => {
        const horarios = r.horarios.map((h, hi) =>
          `<button class="chip ${h.activo ? '' : 'off'}" onclick="toggleHorario(${i},${hi})">${esc(h.hora)}</button>`
        ).join('') || '<span style="color:#6B6178;font-size:0.85rem">Sin horarios</span>';

        const unidades = r.units.map((u, ui) => {
          const asientos = Array.from({ length: u.seats }, (_, k) => {
            const n = k + 1;
            const bloqueado = u.booked.includes(n);
            return `<button class="asiento ${bloqueado ? 'off' : ''}" title="${bloqueado ? 'Bloqueado' : 'Libre'}" onclick="toggleAsiento(${i},${ui},${n})">${n}</button>`;
          }).join('');

          return `<div class="unidad-row">
            <div class="unidad-nombre">${esc(u.name)}<small>${esc(u.type)}</small></div>
            <div>$<input class="precio-input" type="number" min="0" step="10" value="${esc(String(u.price))}" oninput="setPrecio(${i},${ui},this.value)"></div>
            <div class="asientos">${asientos}</div>
            <button class="switch ${u.activo ? 'on' : 'off'}" onclick="toggleUnidad(${i},${ui})">${u.activo ? 'Activa' : 'Apagada'}</button>
          </div>`;
        }).join('');

        return `<div class="ruta-card ${r.activo ? '' : 'off'}">
          <div class="ruta-top">
            <div>
              <div class="ruta-nombre">${esc(r.name)}</div>
              <div class="ruta-meta">${esc(r.diff)} · ${esc(r.dur)} · ${esc(r.dist)}</div>
            </div>
            <div style="display:flex;gap:10px;align-items:center">
              <span class="guardado" id="ok-${i}"></span>
              <button class="switch ${r.activo ? 'on' : 'off'}" onclick="toggleRuta(${i})">${r.activo ? 'Publicada' : 'Oculta'}</button>
              <button class="btn-guardar" id="save-${i}" onclick="guardarRuta(${i})">Guardar</button>
            </div>
          </div>
          <div class="ruta-body">
            <div class="bloque-lbl">HORARIOS</div>
            <div class="chips">${horarios}</div>
            <div class="bloque-lbl">UNIDADES Y ASIENTOS</div>
            ${unidades || '<p style="color:#6B6178;font-size:0.85rem">Sin unidades</p>'}
          </div>
        </div>`;
      }).join('');
    }

    function toggleRuta(i) {
      catalogoCache[i].activo = !catalogoCache[i].activo;
      renderCatalogo();
    }

    function toggleHorario(i, hi) {
      const h = catalogoCache[i].horarios[hi];
      h.activo = !h.activo;
      renderCatalogo();
    }

    function toggleUnidad(i, ui) {
      const u = catalogoCache[i].units[ui];
      u.activo = !u.activo;
      renderCatalogo();
    }

    // Un asiento "bloqueado" no se puede reservar desde la página
    function toggleAsiento(i, ui, n) {
      const u = catalogoCache[i].units[ui];
      const pos = u.booked.indexOf(n);
      if (pos === -1) u.booked.push(n);
      else u.booked.splice(pos, 1);
      renderCatalogo();
    }

    function setPrecio(i, ui, valor) {
      const precio = Number(valor);
      if (Number.isFinite(precio) && precio >= 0) catalogoCache[i].units[ui].price = precio;
    }

    async function guardarRuta(i) {
      const r = catalogoCache[i];
      const btn = document.getElementById('save-' + i);
      const ok = document.getElementById('ok-' + i);
      btn.disabled = true;
      btn.textContent = 'Guardando...';

      try {
        const res = await fetch(`${API_URL}/api/catalogo/${r.rid}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({
            activo: r.activo,
            horarios: r.horarios.map(h => ({ hora: h.hora, activo: h.activo })),
            units: r.units.map(u => ({ id: u.id, price: u.price, activo: u.activo, booked: u.booked }))
          })
        });
        const data = await res.json();
        if (data.ok) {
          ok.textContent = '✓ Guardado';
          setTimeout(() => { ok.textContent = ''; }, 2500);
        } else {
          alert('Error: ' + (data.error || 'No se pudo guardar'));
        }
      } catch (err) {
        alert('Error de conexión al guardar');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Guardar';
      }
    }

    function logout() {
      catalogoCache = [];
      localStorage.removeItem('admin_token');
      token = null;
      document.getElementById('login').style.display = 'block';
      document.getElementById('panel').style.display = 'none';
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';
    }

    checkSession();
  </script>
</body>
</html>
